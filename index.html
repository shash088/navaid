<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAV-AID: accessible maps for India</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10243A;--teal:#0E7C86;--bad:#C8102E;--ok:#1B7F3B;--warn:#B25E00;--line:#D9E1E8;--shadow:0 2px 12px rgba(16,36,58,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:"Atkinson Hyperlegible",system-ui,Segoe UI,Arial,sans-serif;color:var(--ink);font-size:16px;line-height:1.4}
:focus-visible{outline:3px solid #6A3DE8;outline-offset:2px}
#map{position:fixed;inset:0;background:#E6EDF2}
#mapNote{position:fixed;z-index:1004;left:50%;top:45%;transform:translate(-50%,-50%);width:min(440px,90vw);background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:16px;display:none}
#mapNote code{background:#EEF3F7;padding:1px 6px;border-radius:5px}
.qp{border:0;background:#F2F6F9;border-radius:10px;padding:11px 12px;text-align:left;font:inherit;font-size:14px}
.qp:hover{background:#E1ECF2}
#sheet.home{max-height:38vh}
button{font:inherit;color:inherit;cursor:pointer}
.box{background:#fff;border-radius:14px;box-shadow:var(--shadow)}
/* top */
#top{position:fixed;z-index:1000;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
.sb{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 14px;position:relative}
.sb input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:17px;padding:11px 4px;background:transparent;color:var(--ink)}
.sb .ic{font-size:18px;width:22px;text-align:center;flex:none}
.sb button{border:0;background:transparent;width:40px;height:40px;border-radius:50%;font-size:20px;flex:none}
.sb button:hover{background:#EEF3F7}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:5}
.sugg button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:12px 14px;border-bottom:1px solid var(--line)}
.sugg button:hover,.sugg button:focus{background:#EEF3F7}
.sugg small{display:block;color:#5B7288}
#dirbar{padding:8px 8px 8px 10px;display:none;gap:2px;flex-direction:column}
#dirbar .sb{box-shadow:none;border:2px solid var(--line);border-radius:10px;padding:0 4px 0 10px}
#dirbar .sb+.sb{margin-top:6px}
#dirHead{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-weight:700}
#dirHead button{border:0;background:#EEF3F7;border-radius:50%;width:36px;height:36px}
body.dir #dirbar{display:flex}body.dir #sb1{display:none}
body.nav #top{display:none}
#chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:#fff;border-radius:99px;padding:8px 14px;box-shadow:var(--shadow);font-weight:700;font-size:14px;white-space:nowrap}
.chip[aria-pressed=false]{opacity:.55;text-decoration:line-through}
#zoomHint{align-self:flex-start;background:#FFE9A8;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;display:none}
/* sheet */
#sheet{position:fixed;z-index:1001;left:0;right:0;bottom:0;max-height:55vh;overflow:auto;border-radius:18px 18px 0 0;padding:6px 16px calc(16px + env(safe-area-inset-bottom))}
#sheet[hidden]{display:none}
#grab{width:44px;height:5px;background:#C3CFDA;border-radius:9px;margin:4px auto 10px}
#sheet h2{margin:0 0 2px;font-size:1.25rem}
.sub{color:#546C82;font-size:14px}
.btn{border:0;border-radius:99px;padding:12px 20px;font-weight:700;background:var(--teal);color:#fff}
.btn.alt{background:#E6F2F3;color:var(--teal)}
.btn.red{background:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.modes{display:flex;gap:6px;overflow-x:auto;margin:4px 0 8px;scrollbar-width:none}
.mode{flex:none;border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:14px}
.mode[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rc{border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;display:block;width:100%;text-align:left;background:#fff}
.rc[aria-pressed=true]{border-color:var(--teal);background:#EAF6F7}
.rc b{font-size:1.1rem}.rc .sc{float:right;font-weight:700;color:var(--teal);font-size:1.2rem}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--teal);color:#fff;margin-right:4px}.tag.g{background:#6B7F92}
ul.l{list-style:none;margin:6px 0 0;padding:0}
ul.l li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.ct{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.ct div{background:#F2F6F9;border-radius:10px;padding:8px 10px;font-size:14px}
.ct b{font-size:1.2rem;margin-right:4px}
.warn{background:#FFF3D6;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
/* fabs */
#fabs{position:fixed;z-index:1002;right:12px;bottom:12px;display:flex;flex-direction:column;gap:10px}
.fab{width:50px;height:50px;border-radius:50%;border:0;background:#fff;box-shadow:var(--shadow);font-size:22px}
.fab.on{background:var(--bad);color:#fff}
.fab.sos{background:var(--bad);color:#fff;font-size:21px}
/* nav banner */
#nb{position:fixed;z-index:1003;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:none}
body.nav #nb{display:block}
#nb .big{font-size:1.5rem;font-weight:700;line-height:1.2}
#nb .al{margin-top:8px;background:#FFE9EC;color:#6a0016;border-radius:8px;padding:8px 10px;font-weight:700;display:none}
.mk{width:34px;height:34px;border-radius:3px;display:grid;place-items:center;box-shadow:0 2px 7px #0005;color:#fff}
.me{width:20px;height:20px;border-radius:50%;background:#2563EB;border:4px solid #fff;box-shadow:0 0 0 3px rgba(37,99,235,.4)}
.leaflet-control-zoom{display:none}
.leaflet-popup-content button{margin:3px 2px}
.err{color:var(--bad);font-weight:700}
.chat-log{display:grid;gap:7px;max-height:26vh;overflow:auto;padding:8px;background:#F2F6F9;border-radius:10px}.chat-msg{padding:8px 10px;border-radius:10px;font-size:14px;max-width:92%}.chat-msg.bot{background:#fff;justify-self:start}.chat-msg.user{background:#DCEFF0;justify-self:end}.chat-choices{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chat-choices button{border:1px solid var(--line);border-radius:99px;background:#fff;padding:7px 10px;font-weight:700;font-size:13px}.chat-compose{display:flex;gap:6px}.chat-compose input{min-width:0;flex:1;border:1px solid var(--line);border-radius:9px;padding:9px}
.map-loading{position:fixed;z-index:999;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;background:#fff;border-radius:99px;padding:11px 16px;box-shadow:var(--shadow);font-weight:700;font-size:14px;transition:opacity .3s,transform .3s}.map-loading.done{opacity:0;transform:translate(-50%,-46%);pointer-events:none}.spinner{width:18px;height:18px;border:3px solid #C9D8E3;border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}.loading::before{content:"";display:inline-block;vertical-align:middle;width:14px;height:14px;margin-right:7px;border:2px solid #B25E00;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}.sugg:not([hidden]){animation:dropIn .18s ease-out}.mk{animation:markerIn .28s cubic-bezier(.2,.8,.25,1.2) both}.chat-msg{animation:messageIn .18s ease-out both}.fab,.btn,.chip,.mode,.rc{transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease}.fab:hover,.btn:hover,.chip:hover,.mode:hover,.rc:hover{transform:translateY(-2px);box-shadow:0 5px 16px rgba(16,36,58,.2)}#sheet:not([hidden]){animation:sheetIn .22s ease-out both}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}@keyframes markerIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}@keyframes messageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@keyframes sheetIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.sr{position:absolute;left:-9999px}
@media(min-width:820px){
 #sheet.home{bottom:auto;max-height:calc(100vh - 92px)}
 #top{width:410px;right:auto}
 #chips{position:fixed;left:434px;top:calc(12px + env(safe-area-inset-top));right:80px;padding:0}

 #sheet{left:12px;right:auto;width:410px;bottom:12px;top:80px;max-height:none;border-radius:14px;padding-top:12px}
 body.dir #sheet{top:200px}
 #grab{display:none}
 #nb{width:410px;right:auto}
 .leaflet-control-zoom{display:block}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
 .mk .sym{width:26px;height:26px;display:block;stroke:#fff;fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}.chip-sym{width:24px;height:24px;background:#df2029;border-radius:3px;display:inline-grid;place-items:center;vertical-align:-7px;margin-right:4px}.chip .sym{width:18px;height:18px;display:block;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}</style>
</head>
<body>
<div id="map" role="application" aria-label="Accessibility map"></div>
<div id="mapLoading" class="map-loading"><span class="spinner" aria-hidden="true"></span>Loading map</div>

<div id="top">
 <div class="box sb" id="sb1">
  <span class="ic" aria-hidden="true">🔍</span>
  <input id="q" type="search" placeholder="Search any place" aria-label="Search a place" autocomplete="off">
  <button id="qx" aria-label="Clear" hidden>✕</button>
  <button id="qd" aria-label="Directions" title="Directions">➤</button>
  <div class="sugg" id="s1" hidden></div>
 </div>
 <div class="box" id="dirbar">
  <div id="dirHead"><button id="dirClose" aria-label="Close directions">←</button>Accessible directions</div>
  <div class="sb"><span class="ic" aria-hidden="true">🔵</span><input id="from" placeholder="Start (or tap ◎)" aria-label="Start" autocomplete="off"><button id="fromLoc" aria-label="Use my location">◎</button><div class="sugg" id="s2" hidden></div></div>
  <div class="sb"><span class="ic" aria-hidden="true">📍</span><input id="to" placeholder="Destination" aria-label="Destination" autocomplete="off"><button id="swap" aria-label="Swap">⇅</button><div class="sugg" id="s3" hidden></div></div>
 </div>
 <div id="chips" role="group" aria-label="Show on map"></div>
 <div id="zoomHint">Zoom in to see hazards</div>
</div>

<div id="mapNote" role="alert"><b>The map tiles are not loading.</b><p id="mapWhy"></p></div>

<div id="nb" role="status" aria-live="assertive"><div class="big" id="nbT"></div><div class="al" id="nbA"></div></div>
<div id="fabs">
 <button class="fab" id="repBtn" aria-label="Report a hazard" title="Report a hazard">🕳</button>
 <button class="fab" id="chatBtn" aria-label="Open support chat" title="Support chat">💬</button>
 <button class="fab sos" id="sosBtn" aria-label="Emergency help" title="Emergency help">🆘</button>
 <button class="fab" id="locBtn" aria-label="My location" title="My location">◎</button>
</div>
<div class="box" id="sheet" hidden><div id="grab"></div><div id="sb"></div></div>
<div class="sr" id="live" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>window.L||document.write('<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>')</script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

/* ---------- categories (everything shown by default) ---------- */
const CATS={
 steps:{i:'🪜',c:'#C8102E',t:'Steps',g:'Steps'},kerb:{i:'⬆',c:'#B25E00',t:'Raised kerb',g:'Kerbs'},
 crossP:{i:'🚸',c:'#B25E00',t:'Crossing, no signal',g:'Crossings'},crossS:{i:'🚦',c:'#1B7F3B',t:'Signal crossing',g:'Crossings'},
 elev:{i:'🛗',c:'#1B7F3B',t:'Elevator',g:'Ramps and lifts'},ramp:{i:'♿',c:'#1B7F3B',t:'Ramp or dropped kerb',g:'Ramps and lifts'},
 surf:{i:'🪨',c:'#B25E00',t:'Rough surface',g:'Rough ground'},narrow:{i:'↔',c:'#B25E00',t:'Narrow path',g:'Narrow and barriers'},
 steep:{i:'⛰',c:'#C8102E',t:'Slope / incline',g:'Slopes'},barrier:{i:'🚧',c:'#B25E00',t:'Barrier',g:'Narrow and barriers'},
 calm:{i:'〰',c:'#B25E00',t:'Speed bump',g:'Narrow and barriers'},wcNo:{i:'🚫',c:'#C8102E',t:'Not wheelchair accessible',g:'Steps'},
 report:{i:'🕳',c:'#C8102E',t:'Reported hazard',g:'Potholes'},pothole:{i:'🕳',c:'#C8102E',t:'Pothole / uneven surface',g:'Potholes'},toilet:{i:'🚻',c:'#0E7C86',t:'Toilets',g:'Facilities'},
 traffic:{i:'🚗',c:'#B25E00',t:'Busy road / traffic',g:'Traffic'},
 transit:{i:'🚇',c:'#0E7C86',t:'Station or stop',g:'Facilities'},hazard:{i:'⚠',c:'#C8102E',t:'Marked hazard',g:'Potholes'}
};
const SYMBOLS={
 steps:'<path d="M4 20h5v-5h5v-5h6"/>',
 steep:'<path d="M3 19h18M4 18 18 5"/>',
 crossP:'<path d="m5 4 4 16m2-16 4 16m2-16 3 16"/>',
 crossS:'<path d="m3 4 4 16m2-16 4 16m2-16 3 16"/><circle cx="20" cy="5" r="1.4"/>',
 elev:'<path d="M5 21V3h14v18"/><path d="M12 6v5m-3-3 3-3 3 3m-3 4v6m-3-3 3 3 3-3"/>',
 ramp:'<path d="M3 20h18M4 19 18 5"/>',
 surf:'<path d="M3 17h5l4-7 4 7h3l3-5"/>',
 narrow:'<path d="M4 21V4h16v17M8 17h8m-7-4h6m-5-4h4"/>',
 kerb:'<path d="M3 20h6v-5h5v-5h7"/>',
 barrier:'<path d="M5 21h14M8 21V9a4 4 0 0 1 8 0v12"/>',
 calm:'<path d="M3 18h4l3-7h4l3 7h4"/>',
 wcNo:'<circle cx="12" cy="12" r="9"/><path d="m6 6 12 12"/>',
 report:'<path d="M3 17q4-8 9-8t9 8"/><path d="M5 18h14"/>',
 pothole:'<path d="M3 17q4-8 9-8t9 8"/><path d="M5 18h14"/>',
 toilet:'<path d="M6 4h12v5H6zM7 9v3a5 5 0 0 0 10 0V9M12 17v3m-4 0h8"/>',
 traffic:'<path d="M4 16V12l2-5h12l2 5v4zM4 12h16M7 16v3m10-3v3"/>',
 transit:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8v6H8zM8 17h.1m7.9 0h.1M8 21l2-3m6 3-2-3"/>',
 hazard:'<path d="m12 3 10 18H2z"/><path d="M12 9v5m0 3h.1"/>'
};
const symbol=k=>'<svg class="sym" viewBox="0 0 24 24" aria-hidden="true">'+(SYMBOLS[k]||SYMBOLS.hazard)+'</svg>';
const GOOD=new Set(['elev','ramp','crossS','toilet','transit']);
const GROUPS=[['Steps','steps'],['Ramps and lifts','ramp'],['Crossings','crossS'],['Rough ground','surf'],['Narrow and barriers','narrow'],['Slopes','steep'],['Kerbs','kerb'],['Traffic','traffic'],['Potholes','pothole'],['Facilities','toilet']];
const hiddenG=new Set();

/* ---------- modes: nothing to configure, everything on by default ---------- */
const MODES={
 all:{n:'All needs',p:{noStairs:1,noKerb:1,noUnpaved:1,noNarrow:1,signals:1,tactile:1,maxSlope:5,speed:3.2,maxKm:3}},
 wheel:{n:'Wheelchair',p:{noStairs:1,noKerb:1,noUnpaved:1,noNarrow:1,signals:0,tactile:0,maxSlope:5,speed:3.2,maxKm:3}},
 walk:{n:'Walking aid',p:{noStairs:1,noKerb:0,noUnpaved:1,noNarrow:0,signals:0,tactile:0,maxSlope:6,speed:2.8,maxKm:2}},
 blind:{n:'Blind or low vision',p:{noStairs:0,noKerb:0,noUnpaved:0,noNarrow:0,signals:1,tactile:1,maxSlope:8,speed:3.5,maxKm:4}},
 hearing:{n:'Deaf / hard of hearing',p:{noStairs:0,noKerb:0,noUnpaved:0,noNarrow:0,signals:1,tactile:0,maxSlope:8,speed:3.2,maxKm:3}},
 sensory:{n:'Cognitive / sensory needs',p:{noStairs:1,noKerb:1,noUnpaved:1,noNarrow:1,signals:1,tactile:0,maxSlope:5,speed:2.6,maxKm:2}},
 stamina:{n:'Limited stamina / fatigue',p:{noStairs:1,noKerb:1,noUnpaved:1,noNarrow:0,signals:0,tactile:0,maxSlope:4,speed:2,maxKm:1.5}},
 temporary:{n:'Temporary injury',p:{noStairs:1,noKerb:1,noUnpaved:1,noNarrow:0,signals:0,tactile:0,maxSlope:5,speed:2.5,maxKm:2}}
};
let mode=store.get('navaid_mode','all');if(!MODES[mode])mode='all';
let P=MODES[mode].p;

/* ---------- map ---------- */
const v0=store.get('navaid_view2',{c:[28.70,77.35],z:11});
const map=L.map('map',{zoomControl:true,tap:true,minZoom:5,maxBounds:[[5,66],[38,99]],maxBoundsViscosity:.7}).setView(v0.c,v0.z);
L.control.zoom({position:'bottomleft'}).addTo(map);
const TILES=[
 ['https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_4zfw_1_37b367e51623c92d26685984',{subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap contributors © CARTO'}],
 ['https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}],
 ['https://a.tile.openstreetmap.de/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}]];
let tl=null,tErr=0,tOk=0;
function useTiles(i){
 if(tl)map.removeLayer(tl);tErr=0;
 tl=L.tileLayer(TILES[i][0],TILES[i][1]).addTo(map);
 tl.on('tileload',()=>{tOk++;$('#mapLoading').classList.add('done');$('#mapNote').style.display='none'});
 tl.on('tileerror',()=>{if(++tErr>=4&&!tOk){if(i+1<TILES.length)useTiles(i+1);else showNote()}});
}
useTiles(0);
function showNote(){
 $('#mapLoading').classList.add('done');
 const framed=window.top!==window.self,file=location.protocol==='file:';
 $('#mapWhy').innerHTML=framed?'This preview blocks external map tiles. Open the downloaded NAV-AID file in a regular browser tab.'
  :file?'<b>This page is opened directly from a file.</b> Map providers may block file:// requests. Open NAV-AID with the included local launcher to open NAV-AID through localhost, then refresh.'
  :!navigator.onLine?'Your device looks offline. Connect to the internet and reload.'
  :'The map tile providers are blocked or unavailable on this network. Try another network or disable the blocker for this page.';
 $('#mapNote').style.display='block';
}
setTimeout(()=>{if(!tOk)showNote()},9000);
const G={route:L.layerGroup().addTo(map),all:L.layerGroup().addTo(map),pins:L.layerGroup().addTo(map),rep:L.layerGroup().addTo(map)};
let meMarker=null;
const S={from:null,to:null,place:null,routes:[],sel:0,viewEls:[],fetched:null,busy:false,nav:null,reporting:false,routeMode:false};
const icon=c=>L.divIcon({className:'',iconSize:[34,34],iconAnchor:[17,17],html:'<div class="mk" style="background:#df2029">'+symbol(c)+'</div>'});
const pin=(ll,t,col)=>L.marker(ll,{icon:L.divIcon({className:'',iconSize:[34,34],iconAnchor:[17,17],html:`<div class="mk" style="background:${col};width:34px;height:34px;font-weight:700">${t}</div>`})});

/* ---------- helpers ---------- */
const R=6371000,rad=d=>d*Math.PI/180;
function dist(a,b){const x=rad(b[1]-a[1])*Math.cos(rad((a[0]+b[0])/2)),y=rad(b[0]-a[0]);return Math.hypot(x,y)*R}
function densify(c,step=8){const out=[c[0]];for(let i=1;i<c.length;i++){const d=dist(c[i-1],c[i]),n=Math.max(1,Math.ceil(d/step));for(let k=1;k<=n;k++)out.push([c[i-1][0]+(c[i][0]-c[i-1][0])*k/n,c[i-1][1]+(c[i][1]-c[i-1][1])*k/n])}return out}
const cell=p=>[Math.floor(p[0]/0.0003),Math.floor(p[1]/0.0003)];
const km=m=>m>=1000?(m/1000).toFixed(1)+' km':Math.round(m)+' m';
const mins=m=>{const t=Math.max(1,Math.round(m/1000/P.speed*60));return t>=60?Math.floor(t/60)+' h '+t%60+' min':t+' min'};

  for(const u of OVP){
   const host=u.split('/')[2];if((deadUntil[host]||0)>Date.now())continue;
   for(let n=0;n<3;n++){
    const ac=new AbortController(),link=()=>ac.abort();ctrl.signal.addEventListener('abort',link,{once:true});

    }catch(e){
     if(ctrl.signal.aborted)throw stopMsg();
     errs.push(host+': '+(ac.signal.aborted?'no reply in 15 s':'blocked/unreachable'));deadUntil[host]=Date.now()+600000;break;
    }finally{clearTimeout(tm);ctrl.signal.removeEventListener('abort',link)}

const OC='navaid_ovp_cache2';

}

async function osmApiTile(box,depth=0){

 const url=`https://api.openstreetmap.org/api/0.6/map.json?bbox=${w},${s},${e},${n}`;
 let out;
 try{out=await paced(async()=>{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),35000);
  try{const r=await fetch(url,{signal:ac.signal});return {status:r.status,data:r.status===200?await r.json():null}}finally{clearTimeout(tm)}})}

 if(out.status===400&&depth<2){
  const mi=(s+n)/2,mj=(w+e)/2,f=v=>v.toFixed(5);
  const parts=[`(${f(s)},${f(w)},${f(mi)},${f(mj)})`,`(${f(s)},${f(mj)},${f(mi)},${f(e)})`,`(${f(mi)},${f(w)},${f(n)},${f(mj)})`,`(${f(mi)},${f(mj)},${f(n)},${f(e)})`];

async function osrm(pts){

 const r=await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${c}?overview=full&geometries=geojson&alternatives=true&steps=true`);

function instrText(s){

 const grid=new Map();
 route.dense.forEach((p,i)=>{const [a,b]=cell(p);const k=a+','+b;if(!grid.has(k))grid.set(k,[]);grid.get(k).push(i)});
 const out=[];
 for(const h of els){
  const stride=Math.max(1,Math.ceil(h.pts.length/200));let best=null,bestPoint=0,bestD=Infinity;
  for(let q=0;q<h.pts.length;q+=stride){
   const p=h.pts[q],[a,b]=cell(p);
   for(let da=-3;da<=3;da++)for(let db=-3;db<=3;db++){
    const arr=grid.get((a+da)+','+(b+db));if(!arr)continue;
    for(const i of arr){const d=dist(route.dense[i],p);if(d<=(h.cat==='traffic'?25:65)&&d<bestD){best=i;bestPoint=q;bestD=d}}
   }
  }
  if(best!==null)out.push({h,idx:best,hidx:bestPoint,distance:bestD,cost:costOf(h)});
 }

 let lastT=-999;return out.filter(o=>{if(o.h.cat!=='traffic')return true;if(o.idx-lastT<15)return false;lastT=o.idx;return true});
}
async function getRoutes(){

   const more=await Promise.allSettled([1,-1].map(s=>osrm([a,[mid[0]+s*-vx*.22,mid[1]+s*vy*.22],b])));

  try{onEach(await mk(line));ok++}
  catch(e){failed++;err=(e&&e.message)||String(e);if(!ok&&failed>=2)stop=true}
  done++;if(!onEach.progress(done,list.length))stop=true}};

const TCOL=['#0E7C86','#F29900','#D93025'];
function trafficLevels(route,els){
 const n=route.dense.length,lv=new Array(n).fill(0),grid=new Map();
 route.dense.forEach((p,i)=>{const [a,b]=cell(p),k=a+','+b;if(!grid.has(k))grid.set(k,[]);grid.get(k).push(i)});
 for(const h of els){
  if(h.cat!=='traffic'||h.note)continue;
  const hw=h.tags&&h.tags.highway,L=/^(trunk|primary)$/.test(hw||'')?2:hw==='secondary'?1:0;
  if(!L||!h.line)continue;
  for(const p of densify(h.pts,10)){
   const [a,b]=cell(p);
   for(let da=-2;da<=2;da++)for(let db=-2;db<=2;db++){
    const arr=grid.get((a+da)+','+(b+db));if(!arr)continue;
    for(const i of arr)if(lv[i]<L&&dist(route.dense[i],p)<=25)lv[i]=L;
   }
  }

 h+='<div class="btns"><button class="btn" id="goNav">Start</button><button class="btn alt" id="goSim">Preview walk</button></div>';
 const gUrl='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(S.from.ll.join(','))+'&destination='+encodeURIComponent(S.to.ll.join(','))+'&travelmode=walking';
 h+='<a class="btn alt" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="'+gUrl+'">Open walking route in Google Maps ↗</a>';
 {const mp=r.dense[Math.floor(r.dense.length/2)];h+='<a class="btn alt" style="display:inline-block;text-decoration:none;margin-top:8px" target="_blank" rel="noopener" href="https://www.google.com/maps/@'+mp[0].toFixed(5)+','+mp[1].toFixed(5)+',14z/data=!5m1!1e1">See live traffic on Google Maps ↗</a>'}
 h+='<h3 style="margin:6px 0 0">Turn-by-turn &amp; access details</h3><ul class="l">';
 const events=r.steps.map((s,i)=>({idx:s.idx,icon:String(i+1),text:s.text,obstacle:null})).concat(r.matched.filter(m=>m.h.cat!=='traffic').map(m=>({idx:m.idx,icon:CATS[m.h.cat].i,text:m.h.m,obstacle:m}))).sort((a,b)=>a.idx-b.idx);
 h+=events.length?events.map(e=>'<li><span>'+e.icon+'</span><span><b>'+km(r.cum[e.idx])+'</b> '+esc(e.text)+(e.obstacle&&!GOOD.has(e.obstacle.h.cat)&&e.obstacle.cost>=250?' <b style="color:var(--bad)">avoid if you can</b>':'')+'</span></li>').join(''):'<li>No route steps are available.</li>';
 openSheet(h);bindModes();
 $$('.rc').forEach(b=>b.onclick=()=>{S.sel=+b.dataset.i;renderRoutes()});
 if($('#rescan'))$('#rescan').onclick=()=>{S.routes=[];maybeRoute()};bindSummary(r);$('#goNav').onclick=()=>startNav(false);$('#goSim').onclick=()=>startNav(true);
 drawRoute();
}
function routeSummary(r){
 const g={};GROUPS.forEach(([n])=>g[n]=0);
 r.matched.forEach(m=>{const n=CATS[m.h.cat].g;if(n in g)g[n]++});
 return '<h3 style="margin:10px 0 2px">On this route (tap to jump)</h3><div class="ct">'+GROUPS.map(([n,k])=>`<button class="qp" data-rg="${n}" ${g[n]?'':'disabled'} style="opacity:${g[n]?1:.5}"><span class="chip-sym">${symbol(k)}</span> <b>${g[n]}</b> ${n}</button>`).join('')+'</div><p class="sub">Potholes only show if mapped or reported (🕳 button). Traffic = busy roads beside the route.</p>';
}
function bindSummary(r){
 $$('[data-rg]').forEach(b=>b.onclick=()=>{
  const m=r.matched.find(x=>CATS[x.h.cat].g===b.dataset.rg);if(!m)return;
  const p=m.h.pts[m.hidx??0]||m.h.pts[0];
  if(hiddenG.has(b.dataset.rg)){hiddenG.delete(b.dataset.rg);$$('.chip').forEach(c=>{if(c.dataset.g===b.dataset.rg)c.setAttribute('aria-pressed','true')});drawRoute(false)}
  map.setView(p,18);L.popup().setLatLng(p).setContent('<b>'+CATS[m.h.cat].t+'</b><br>'+esc(m.h.m)+'<br>'+km(r.cum[m.idx])+' from start').openOn(map);
 });
}
function drawRoute(fit=true){
 G.route.clearLayers();G.pins.clearLayers();
 pin(S.from.ll,'A','#10243A').addTo(G.pins);pin(S.to.ll,'B','#6A3DE8').addTo(G.pins);
 S.routes.forEach((r,i)=>{if(i!==S.sel)L.polyline(r.dense,{color:'#6B7F92',weight:6,opacity:.6,dashArray:'6 8'}).addTo(G.route).on('click',()=>{S.sel=i;renderRoutes()})});
 const r=S.routes[S.sel];
 L.polyline(r.dense,{color:'#fff',weight:12}).addTo(G.route);
 const line=L.polyline(r.dense,{color:TCOL[0],weight:7,opacity:0}).addTo(G.route);
 if(r.tl){let s=0;for(let i=1;i<=r.dense.length;i++){if(i===r.dense.length||r.tl[i]!==r.tl[s]){L.polyline(r.dense.slice(s,Math.min(i+1,r.dense.length)),{color:TCOL[r.tl[s]],weight:7,lineCap:'butt',lineJoin:'round',interactive:false}).addTo(G.route);s=i}}}
 else L.polyline(r.dense,{color:TCOL[0],weight:7,interactive:false}).addTo(G.route);
 r.matched.forEach(m=>{const h=m.h;if(h.cat==='traffic'||hiddenG.has(CATS[h.cat].g))return;
  if(h.line&&h.cat!=='traffic')L.polyline(h.pts,{color:CATS[h.cat].c,weight:6,opacity:.9,interactive:false}).addTo(G.route);
  const accessPoint=h.pts[m.hidx??Math.floor(h.pts.length/2)]||h.pts[0];L.marker(accessPoint,{icon:icon(h.cat),title:CATS[h.cat].t}).addTo(G.route).bindPopup('<b>'+CATS[h.cat].t+'</b><br>'+esc(h.m)+'<br>'+km(r.cum[m.idx])+' from start');
 });
 if(fit&&!S.noFit&&!document.body.classList.contains('nav'))map.fitBounds(line.getBounds().pad(.15),{paddingBottomRight:[0,innerWidth<820?innerHeight*.45:0],paddingTopLeft:[innerWidth>=820?430:0,innerWidth<820?140:0]});
}

/* ---------- navigation ---------- */
let voiceOn=true,timer=null,watch=null;
function speak(t){$('#live').textContent=t;if(voiceOn&&'speechSynthesis' in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
function stopNav(){clearInterval(timer);timer=null;if(watch!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watch);watch=null}
function startNav(sim){
 const r=S.routes[S.sel];r.steps.forEach(s=>s.idx=nearestIdx(r.dense,s.ll)[0]);
 S.nav={r,cur:0,alerted:new Set(),said:-1};stopNav();
 document.body.classList.add('nav');document.body.classList.remove('dir');
 openSheet(`<div style="display:flex;align-items:center;gap:10px"><div style="flex:1"><b id="eta">${mins(r.dist)}</b> · <span id="rem">${km(r.dist)}</span><div class="sub">to ${esc(short(S.to.name))}</div></div>
  <button class="btn alt" id="vo">${voiceOn?'🔊':'🔇'}</button><button class="btn red" id="endNav">End</button></div>`);
 $('#vo').onclick=e=>{voiceOn=!voiceOn;e.target.textContent=voiceOn?'🔊':'🔇'};
 $('#endNav').onclick=endNav;
 $('#nbT').textContent='Starting…';
 map.setZoom(18);speak('Navigation started.');
 if(sim){let i=0;const d=r.dense;timer=setInterval(()=>{tick(d[Math.min(i,d.length-1)]);i+=3;if(i>d.length+3)stopNav()},350)}
 else if(navigator.geolocation)watch=navigator.geolocation.watchPosition(p=>tick([p.coords.latitude,p.coords.longitude]),()=>{$('#nbT').textContent='Cannot read your location';speak('Cannot read your location')},{enableHighAccuracy:true,maximumAge:1000});
 else $('#nbT').textContent='GPS is not available. Try Preview walk.';
}
function endNav(){stopNav();document.body.classList.remove('nav');document.body.classList.add('dir');$('#nbA').style.display='none';maybeRouteRender()}
function maybeRouteRender(){if(S.routes.length)renderRoutes()}
function tick(p){
 const N=S.nav,r=N.r;
 if(!meMarker)meMarker=L.marker(p,{icon:L.divIcon({className:'',iconSize:[20,20],html:'<div class="me"></div>'}),zIndexOffset:1000}).addTo(map);
 meMarker.setLatLng(p);map.panTo(p,{animate:true});
 const [idx,dev]=nearestIdx(r.dense,p,Math.max(0,N.cur-5),250);
 if(dev>80){$('#nbT').textContent='Off route';$('#nbA').style.display='block';
  $('#nbA').innerHTML='You are off the route. <button class="btn" id="recalc" style="padding:6px 14px;margin-left:6px">Recalculate</button>';
  $('#recalc').onclick=()=>{S.from={ll:p,name:'My location'};S.routes=[];stopNav();document.body.classList.remove('nav');document.body.classList.add('dir');getRoutes()};return}
 N.cur=Math.max(N.cur,idx);
 let si=0;r.steps.forEach((s,i)=>{if(s.idx<=N.cur)si=i});
 const nxt=r.steps[Math.min(si+1,r.steps.length-1)],left=Math.max(0,Math.round(r.cum[nxt.idx]-r.cum[N.cur]));
 $('#nbT').textContent=`${nxt.text} in ${left} m`;
 const rem=r.dist-r.cum[N.cur];$('#rem').textContent=km(rem);$('#eta').textContent=mins(rem);
 if(N.said!==si){N.said=si;speak(`${nxt.text} in ${left} metres`)}
 r.matched.forEach((m,k)=>{
  const ahead=r.cum[m.idx]-r.cum[N.cur];
  if(ahead>0&&ahead<45&&!N.alerted.has(k)&&!GOOD.has(m.h.cat)){N.alerted.add(k);const t=`${CATS[m.h.cat].t} in ${Math.round(ahead)} metres. ${m.h.m}`;
   const a=$('#nbA');a.style.display='block';a.textContent='⚠ '+t;speak(t);setTimeout(()=>{a.style.display='none'},7000)}
 });
 if(dist(p,r.dense[r.dense.length-1])<25){stopNav();arrive()}
}
function arrive(){
 const t='You have arrived at '+short(S.to.name).split(',')[0]+'.';
 $('#nbT').textContent=t;$('#nbA').style.display='none';speak(t);
 openSheet(`<h2>${t}</h2><div class="btns"><button class="btn" id="share">Tell someone I arrived safely</button><button class="btn alt" id="done">Done</button></div>`);
 $('#share').onclick=()=>{const m='I arrived safely at '+short(S.to.name).split(',')[0]+' (NAV-AID).';if(navigator.share)navigator.share({text:m});else{navigator.clipboard?.writeText(m);$('#share').textContent='Message copied'}};
 $('#done').onclick=()=>{document.body.classList.remove('nav');S.routes=[];S.routeMode=false;G.route.clearLayers();closeSheet();loadView(true)};
}

/* ---------- report hazards ---------- */
$('#sosBtn').onclick=openSOSPanel;
$('#chatBtn').onclick=openSupportChat;
$('#repBtn').onclick=()=>{S.reporting=!S.reporting;$('#repBtn').classList.toggle('on',S.reporting);toast(S.reporting?'Tap the map where the hazard is':'')};
map.on('click',e=>{
 if(!S.reporting)return;S.reporting=false;$('#repBtn').classList.remove('on');
 const types=['Pothole','Broken pavement','No ramp','Blocked path','Construction','Open drain'];
 const pop=L.popup().setLatLng(e.latlng).setContent('<b>What is here?</b><br>'+types.map(t=>`<button class="btn" style="padding:6px 12px" data-t="${t}">${t}</button>`).join('')).openOn(map);
 pop.getElement().querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
  const rs=store.get('navaid_reports',[]);rs.push({lat:e.latlng.lat,lon:e.latlng.lng,type:b.dataset.t,ts:Date.now()});store.set('navaid_reports',rs);
  map.closePopup();drawReports();S.viewEls=S.viewEls.filter(h=>h.cat!=='report').concat(reportsAsEls());drawView();toast('Hazard saved. Future routes will avoid it.');
 });
});
function drawReports(){G.rep.clearLayers();store.get('navaid_reports',[]).forEach(r=>L.marker([r.lat,r.lon],{icon:icon('report'),title:r.type}).addTo(G.rep).bindPopup('Reported: '+esc(r.type)+'<br>'+new Date(r.ts).toLocaleDateString()))}
drawReports();

/* ---------- home screen: open on your location, hazards visible ---------- */
showHome();
locate(p=>{if(p[0]>6&&p[0]<37.5&&p[1]>68&&p[1]<98)map.setView(p,16)},()=>{});
setTimeout(()=>loadView(true),800);
</script>
</body>
